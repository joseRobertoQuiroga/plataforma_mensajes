# ═══════════════════════════════════════════════════════════════
# Wibsite — Nginx Reverse Proxy v5 (con Authelia SSO + HTTPS)
# ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=llm:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=60r/m;
limit_req_status 429;

upstream authelia_upstream {
    server authelia:9091;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# Main HTTPS server with SSO — hardened
server {
    listen 443 ssl http2;
    server_name localhost;
    # Handle plain HTTP sent to SSL port (browser typed http://)
    error_page 497 =301 https://$host:8080$request_uri;

    # ─── SSL/TLS Hardening ──────────────────────────────────
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling off;
    ssl_stapling_verify off;
    # Disable weak protocols and compression (CRIME/BEAST)
    ssl_early_data off;

    absolute_redirect off;
    client_max_body_size 50M;
    large_client_header_buffers 4 32k;
    resolver 127.0.0.11 valid=5s;

    # ─── Security Headers Hardened ─────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # Authelia Auth Endpoint (internal)
    location = /auth {
        internal;
        proxy_pass http://authelia:9091/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        # X-Forwarded-Proto siempre https (Nginx termina TLS)
        proxy_set_header X-Forwarded-Proto "https";
        # Host fijo: Authelia usa estos headers para construir el issuer OIDC
        # Debe ser localhost:8080 para que el issuer sea siempre https://localhost:8080
        proxy_set_header X-Forwarded-Host "localhost:8080";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host "localhost:8080";
        proxy_buffer_size 256k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        auth_request_set $auth_user $upstream_http_remote_user;
        auth_request_set $auth_groups $upstream_http_remote_groups;
        auth_request_set $auth_email $upstream_http_remote_email;
        auth_request_set $auth_name $upstream_http_remote_name;
        add_header Set-Cookie $auth_cookie;
    }

    # Redirect 401 to Authelia login
    location @auth_redirect {
        return 302 https://localhost:8080/auth/?rd=https://localhost:8080$request_uri;
    }

    # Authelia Login Portal
    location /auth/ {
        proxy_pass http://authelia:9091/;
        # Host FIJO: garantiza que Authelia genere issuer = https://localhost:8080
        # para cualquier cliente (browser, Chatwoot, MinIO, n8n) que acceda a /auth/
        proxy_set_header Host "localhost:8080";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host "localhost:8080";
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<base href="http://localhost:8080/" />' '<base href="/auth/" />';
        sub_filter '<base href="https://localhost:8080/" />' '<base href="/auth/" />';
        sub_filter 'data-basepath=""' 'data-basepath="/auth"';
    }

    # Wibsite 2.0: Frontend consolidado (Next.js standalone)
    location = / {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        # proxy_pass dinámico: el hostname se re-resuelve (evita 502 tras recrear el contenedor)
        set $frontend_be "http://frontend:4000";
        proxy_pass $frontend_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # PROTEGIDO: Frontend Wibsite 2.0 (SPA Next.js — rutas del App Router)
    location / {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        set $frontend_be "http://frontend:4000";
        proxy_pass $frontend_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # PROTEGIDO: Dify via SSO
    location /dify/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        rewrite ^/dify/(.*) /$1 break;
        proxy_pass http://dify-web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect / /dify/;
        sub_filter_once off;
        sub_filter_types text/html text/css;
        sub_filter 'src="/' 'src="/dify/';
        sub_filter 'href="/' 'href="/dify/';
    }

    # PÚBLICO: Webhooks
    location /webhooks/ {
        set $helper_be "http://helper:3100";
        proxy_pass $helper_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /opt-outs/ {
        set $helper_be "http://helper:3100";
        proxy_pass $helper_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    # Media del chat (imágenes/audios subidos por el helper)
    location /media/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        set $helper_be "http://helper:3100";
        proxy_pass $helper_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 10m;
    }

    # PÚBLICO: Health
    location = /health {
        set $helper_health "http://helper:3100/health";
        proxy_pass $helper_health;
        proxy_set_header Host $http_host;
    }

    location = /api/health {
        set $helper_health "http://helper:3100/health";
        proxy_pass $helper_health;
        proxy_set_header Host $http_host;
    }

    # PROTEGIDO: Helper API
    location /api/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        limit_req zone=api burst=30 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        # F-35: la API key NUNCA se inyecta aquí. El cliente debe enviar su propia
        # X-API-Key; nginx solo autentica el SSO (auth_request) en /admin/.
        # Un valor fijo ("test" en versiones anteriores) producía 403 reales contra
        # el helper (key real distinta) y exponía la credencial en el archivo.
        set $helper_be "http://helper:3100";
        proxy_pass $helper_be;
    }

    # PROTEGIDO: n8n
    location /n8n/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        rewrite ^/n8n/(.*) /$1 break;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
    }

    # PÚBLICO: n8n SSO OIDC endpoints (sin auth_request — forman parte del flujo OIDC)
    # n8n con N8N_PATH=/n8n/ sirve la API en /n8n/rest/*, pero WEBHOOK_URL genera
    # el callback sin el prefijo /n8n/. Nginx reescribe para añadir el prefijo.
    location = /rest/sso/oidc/callback {
        rewrite ^/rest/(.*)$ /n8n/rest/$1 break;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /rest/sso/oidc/login {
        rewrite ^/rest/(.*)$ /n8n/rest/$1 break;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /rest/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /webhook-test/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    location /webhook-waiting/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }

    # PROTEGIDO: Kibana (dynamic resolution)
    location /kibana/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;

        # Kibana gestiona su propio CSP (estricto, con nonces).
        # El CSP global del servidor incluye 'unsafe-inline' y rompe la
        # detección de CSP de Kibana ("Please upgrade your browser").
        # Declaramos add_header a este nivel para anular los heredados de nginx
        # y dejamos pasar el CSP propio de Kibana.
        add_header Content-Security-Policy "";
        proxy_hide_header X-Content-Type-Options;

        set $kibana_be "http://kibana:5601";
        proxy_pass $kibana_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket para Kibana live updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # PROTEGIDO: MinIO Console (dynamic resolution)
    location /minio-console/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        set $minio_be "http://minio:9001/";
        proxy_pass $minio_be;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PÚBLICO: MinIO API (dynamic resolution)
    location /storage/ {
        set $minio_api "http://minio:9000/";
        proxy_pass $minio_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PROTEGIDO: Portal
    location /portal/ {
        auth_request /auth;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @auth_redirect;
        alias /usr/share/nginx/html/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    # PROTEGIDO: Metabase — DESHABILITADO (servicio no desplegado; planificado oleada futura F-52)
    # location /reportes/ {
    #     auth_request /auth;
    #     auth_request_set $auth_cookie $upstream_http_set_cookie;
    #     add_header Set-Cookie $auth_cookie;
    #     error_page 401 = @auth_redirect;
    #     set $metabase_be "http://metabase:3000/";
    #     proxy_pass $metabase_be;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Request-ID $request_id;
    #     proxy_set_header traceparent $http_traceparent;
    #     proxy_set_header tracestate $http_tracestate;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # PROTEGIDO: ERPNext — DESHABILITADO (F-28/F-29 diferido: núcleo actual = Dify + Twenty; ERP complementario futuro)
    # location /erp/ {
    #     auth_request /auth;
    #     auth_request_set $auth_cookie $upstream_http_set_cookie;
    #     add_header Set-Cookie $auth_cookie;
    #     error_page 401 = @auth_redirect;
    #     set $erp_be "http://frappe-frappe:8000/";
    #     proxy_pass $erp_be;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Request-ID $request_id;
    #     proxy_set_header traceparent $http_traceparent;
    #     proxy_set_header tracestate $http_tracestate;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# ─── Dify dedicated server (port 3003 for direct API access) ──
server {
    listen 3003;
    server_name localhost;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=5s;

    location /console/ {
        proxy_pass http://dify-api:5001/console/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /api/ {
        proxy_pass http://dify-api:5001/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /files/ {
        proxy_pass http://dify-api:5001/files/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /plugins/ {
        proxy_pass http://plugin-daemon:5002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Dify-Hook-Url http://localhost:3003/;
    }

    location /marketplace/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "http://localhost:3003" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }
        rewrite ^/marketplace/(.*) /$1 break;
        proxy_pass https://marketplace.dify.ai;
        proxy_ssl_server_name on;
        proxy_set_header Host marketplace.dify.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "http://localhost:3003" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    }

    location / {
        proxy_pass http://dify-web:3000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
