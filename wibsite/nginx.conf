# ═══════════════════════════════════════════════════════════════
# Wibsite — Nginx Reverse Proxy v3
# Solución definitiva: Dify en puerto propio 3003, Hub en 8080
# ═══════════════════════════════════════════════════════════════

# ─── Rate Limiting Zones ──────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=llm:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=60r/m;
limit_req_status 429;

# ────────────────────────────────────────────────────────────
# Servidor Principal (Port 80 -> Host 8080)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=5s;

    # ─── Security Headers ───────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # HUB — Portal de control unificado
    location /hub/ {
        alias /usr/share/nginx/html/hub/;
        index index.html;
        try_files $uri $uri/ /hub/index.html;
    }

    # Raíz → Hub siempre
    location = / {
        return 301 /hub/;
    }

    # Redirección de compatibilidad para Dify antiguo
    location /dify/ {
        return 301 http://localhost:3003/;
    }

    # WEBHOOKS PÚBLICOS
    location /webhooks/ {
        proxy_pass         http://helper:3100;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /opt-outs/ {
        proxy_pass         http://helper:3100;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # HEALTH CHECKS
    location = /health {
        proxy_pass       http://helper:3100/health;
        proxy_set_header Host $http_host;
    }

    location = /api/health {
        proxy_pass       http://helper:3100/health;
        proxy_set_header Host $http_host;
    }

    # HELPER API — Campañas, Leads, Admin dashboard
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://helper:3100;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        rewrite            ^/admin/(.*) /$1 break;
        proxy_pass         http://helper:3100;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    location = /campaigns {
        proxy_pass         http://helper:3100;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /campaigns/ {
        proxy_pass         http://helper:3100;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # N8N — Automatización (N8N_PATH=/n8n/)
    location /n8n/ {
        rewrite            ^/n8n/(.*) /$1 break;
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Assets y API de n8n generados con N8N_PATH=/n8n/
    location /static/ {
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $http_host;
    }

    location /rest/ {
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    location /webhook-test/ {
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /webhook-waiting/ {
        proxy_pass         http://n8n:5678;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # CHATWOOT (Health check)
    location /chatwoot/ {
        proxy_pass         http://chatwoot:3000/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # TWENTY CRM (Health check)
    location /crm/ {
        proxy_pass         http://twenty-server:3000/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ────────────────────────────────────────────────────────────
# Servidor Dedicado Dify (Port 3003 -> Host 3003)
# ────────────────────────────────────────────────────────────
server {
    listen 3003;
    server_name localhost;
    client_max_body_size 50M;
    resolver 127.0.0.11 valid=5s;

    # Dify Console API
    location /console/ {
        proxy_pass         http://dify-api:5001/console/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # Dify Public API
    location /api/ {
        proxy_pass         http://dify-api:5001/api/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;
    }

    # Archivos adjuntos de Dify
    location /files/ {
        proxy_pass         http://dify-api:5001/files/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Plugin Daemon — gestión de plugins (llamado por dify-api internamente,
    # pero también necesita ruta pública para la UI de gestión de plugins)
    location /plugins/ {
        proxy_pass         http://plugin-daemon:5002;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Header requerido por Dify para que el daemon registre sus hooks de vuelta
        proxy_set_header   Dify-Hook-Url     http://localhost:3003/;
    }

    # Marketplace Proxy — resuelve el CORS del browser al llamar a marketplace.dify.ai
    # El browser NO puede llamar directamente a HTTPS externo desde localhost (bloqueo CORS)
    location /marketplace/ {
        # Preflight CORS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "http://localhost:3003" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            add_header Access-Control-Max-Age       1728000;
            add_header Content-Length               0;
            return 204;
        }
        rewrite            ^/marketplace/(.*)  /$1  break;
        proxy_pass         https://marketplace.dify.ai;
        proxy_ssl_server_name on;
        proxy_set_header   Host              marketplace.dify.ai;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Ocultar cabecera CORS del upstream y sustituir por la propia
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header         Access-Control-Allow-Origin      "http://localhost:3003" always;
        add_header         Access-Control-Allow-Credentials "true" always;
        add_header         Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers     "Content-Type, Authorization, X-Requested-With" always;
    }

    # Dify Web Frontend (Next.js)
    location / {
        proxy_pass         http://dify-web:3000/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $http_host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

