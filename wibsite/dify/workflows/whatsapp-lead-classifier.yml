# ═══════════════════════════════════════════════════════════
# Wibsite — WhatsApp Lead Classifier (Dify Workflow)
# ═══════════════════════════════════════════════════════════
# Input:  { message, conversation_history, contact_name, platform }
# Output: { response_text, intent_score, intent_label, captured_data,
#           recommended_action, suggested_response, needs_human }
# ═══════════════════════════════════════════════════════════

version: "1.0"
kind: workflow
name: "Wibsite WhatsApp Lead Classifier"
description: "Analiza mensajes de WhatsApp, clasifica leads y sugiere respuestas"

input_schema:
  type: object
  properties:
    message:
      type: string
      description: "Texto del mensaje entrante"
    conversation_history:
      type: array
      items:
        type: object
        properties:
          role:
            type: string
            enum: [user, assistant]
          content:
            type: string
      description: "Historial reciente de la conversación"
    contact_name:
      type: string
      description: "Nombre del contacto"
    platform:
      type: string
      enum: [whatsapp, messenger, instagram, web]
      default: whatsapp

nodes:
  # ─── 1. Detección de idioma ───────────────────────────
  - id: detect_language
    type: llm
    model: gpt-4o-mini
    system_prompt: |
      Detecta el idioma del mensaje. Responde solo con el código ISO del idioma.
    input: "{{input.message}}"
    output: language

  # ─── 2. Clasificación de intención ────────────────────
  - id: classify_intent
    type: llm
    model: gpt-4o-mini
    system_prompt: |
      Eres un clasificador de intención para un CRM de ventas B2B en Latinoamérica.

      Clasifica el mensaje del cliente en UNA de estas categorías:

      - product_inquiry: Pregunta por productos/servicios, precios, características
      - purchase_intent: Quiere comprar, contratar, suscribirse
      - support: Problema técnico, queja, soporte post-venta
      - meeting_request: Quiere agendar reunión, demo, llamada
      - objection: Objeción de precio, tiempo, competencia
      - follow_up: Respuesta a seguimiento, retoma conversación anterior
      - greeting: Saludo inicial sin intención clara
      - spam: Mensaje no relevante, promoción no solicitada
      - unknown: No se puede clasificar

      Responde SOLO con JSON:
      {
        "intent_label": "...",
        "confidence": 0.0-1.0,
        "sub_intent": "... (descripción corta)",
        "urgency": "low|medium|high",
        "buying_stage": "awareness|consideration|decision|retention"
      }
    input: |
      Idioma: {{detect_language.output}}
      Mensaje: {{input.message}}
      Historial: {{input.conversation_history | tojson}}
    output: intent_classification

  # ─── 3. Extracción de datos del contacto ──────────────
  - id: extract_contact_data
    type: llm
    model: gpt-4o-mini
    system_prompt: |
      Extrae la mayor cantidad de datos posible del mensaje y la conversación.

      Campos a extraer:
      - name: Nombre completo
      - email: Correo electrónico
      - phone: Teléfono
      - company: Empresa
      - position: Cargo
      - interest: Producto/servicio de interés
      - pain_point: Problema o dolor que menciona
      - budget: Presupuesto (si lo menciona)
      - timeline: Plazo (cuándo quiere comprar/implementar)
      - location: Ciudad/País

      Si un campo no está presente, déjalo como null.
      Responde SOLO con JSON.
    input: |
      Nombre conocido: {{input.contact_name}}
      Mensaje: {{input.message}}
      Historial: {{input.conversation_history | tojson}}
    output: captured_data

  # ─── 4. Scoring del lead ──────────────────────────────
  - id: calculate_score
    type: code
    language: python
    code: |
      import json

      intent = json.loads({{classify_intent.output}})
      data = json.loads({{extract_contact_data.output}})

      score = 0

      # Base por intención
      intent_scores = {
          "purchase_intent": 85,
          "meeting_request": 80,
          "product_inquiry": 60,
          "follow_up": 55,
          "objection": 45,
          "support": 30,
          "greeting": 15,
          "spam": 0,
          "unknown": 10
      }

      score = intent_scores.get(intent["intent_label"], 10)

      # Penalizaciones / bonificaciones
      if intent["urgency"] == "high":
          score += 15
      elif intent["urgency"] == "low":
          score -= 5

      if intent.get("buying_stage") == "decision":
          score += 20
      elif intent.get("buying_stage") == "consideration":
          score += 10

      # Datos completos = más calificado
      filled = sum(1 for v in data.values() if v)
      score += filled * 3

      # Capping
      score = max(0, min(100, score))

      # Status
      if score >= 75:
          status = "hot"
          priority = "high"
      elif score >= 40:
          status = "warm"
          priority = "medium"
      else:
          status = "cold"
          priority = "low"

      result = {
          "intent_score": score,
          "lead_status": status,
          "priority": priority,
          "intent_label": intent["intent_label"],
          "confidence": intent["confidence"],
          "buying_stage": intent.get("buying_stage", "awareness"),
          "urgency": intent["urgency"]
      }

      print(json.dumps(result))
    input: ""
    output: scoring

  # ─── 5. Generación de respuesta sugerida ──────────────
  - id: generate_response
    type: llm
    model: gpt-4o-mini
    system_prompt: |
      Eres un asistente de ventas B2B para una empresa de tecnología en Latinoamérica.
      La empresa se llama "Wibsite" y ofrece soluciones de automatización de ventas con IA.

      Tu tono es:
      - Profesional pero cálido
      - En español neutro
      - Responde en el mismo idioma del cliente
      - No eres robótico, suenas natural

      Reglas:
      - Si el cliente saluda, saluda y pregunta cómo puedes ayudar
      - Si pregunta por productos, da info general y ofrece agenda demo
      - Si quiere comprar, pide datos y ofrece agendar llamada
      - Si es una queja, empatiza y escala
      - Si es objeción, aborda gentilmente sin presionar
      - No menciones que eres IA a menos que te pregunten directamente

      Responde SOLO con JSON:
      {
        "suggested_response": "texto de respuesta",
        "should_auto_reply": true/false,
        "needs_human": true/false,
        "escalation_reason": "razón si needs_human=true, sino null",
        "next_best_action": "llamar|enviar_catalogo|agendar_demo|esperar|responder",
        "suggested_tags": ["tag1", "tag2"]
      }
    input: |
      Clasificación: {{classify_intent.output}}
      Datos extraídos: {{extract_contact_data.output}}
      Score: {{calculate_score.output}}
      Historial: {{input.conversation_history | tojson}}
    output: response_plan

  # ─── 6. Ensamble de resultado final ───────────────────
  - id: assemble_result
    type: code
    language: python
    code: |
      import json

      intent = json.loads({{classify_intent.output}})
      data = json.loads({{extract_contact_data.output}})
      score = json.loads({{calculate_score.output}})
      response = json.loads({{generate_response.output}})

      result = {
          "response_text": response["suggested_response"],
          "intent_score": score["intent_score"],
          "intent_label": score["intent_label"],
          "lead_status": score["lead_status"],
          "priority": score["priority"],
          "confidence": score["confidence"],
          "urgency": score["urgency"],
          "buying_stage": score["buying_stage"],
          "captured_data": data,
          "recommended_action": response["next_best_action"],
          "needs_human": response["needs_human"],
          "escalation_reason": response.get("escalation_reason"),
          "should_auto_reply": response["should_auto_reply"],
          "suggested_tags": response["suggested_tags"],
          "suggested_response": response["suggested_response"]
      }

      print(json.dumps(result))
    input: ""
    output: final_result

output_schema:
  type: object
  properties:
    response_text:
      type: string
      description: "Respuesta sugerida para el cliente"
    intent_score:
      type: integer
      description: "Score 0-100"
    intent_label:
      type: string
      description: "Categoría de intención"
    lead_status:
      type: string
      enum: [cold, warm, hot]
    priority:
      type: string
      enum: [low, medium, high]
    confidence:
      type: number
    urgency:
      type: string
    buying_stage:
      type: string
    captured_data:
      type: object
      description: "Datos extraídos del contacto"
    recommended_action:
      type: string
      description: "Próxima acción recomendada"
    needs_human:
      type: boolean
    escalation_reason:
      type: string
    should_auto_reply:
      type: boolean
    suggested_tags:
      type: array
      items:
        type: string
    suggested_response:
      type: string
