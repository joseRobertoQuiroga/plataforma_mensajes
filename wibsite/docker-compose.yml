# Wibsite Business — Fase 1: WhatsApp + AI + Twenty CRM
# Stack: Chatwoot + Dify + n8n + Twenty CRM

name: wibsite

services:
  # ─── Shared Infrastructure ────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wibsite-postgres
    restart: unless-stopped
    labels:
      app: wibsite
      service: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wibsite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wibsite"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wibsite-redis
    restart: unless-stopped
    labels:
      app: wibsite
      service: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.26.1
    container_name: wibsite-weaviate
    restart: unless-stopped
    labels:
      app: wibsite
      service: weaviate
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: text2vec-transformers
      ENABLE_MODULES: text2vec-transformers
      TRANSFORMERS_INFERENCE_API: http://t2v-transformers:8080
    depends_on:
      t2v-transformers:
        condition: service_started

  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-multi-qa-MiniLM-L6-cos-v1
    container_name: wibsite-t2v
    restart: unless-stopped
    labels:
      app: wibsite
      service: t2v-transformers

  # ─── Chatwoot ─────────────────────────────────────────
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: wibsite-chatwoot
    restart: unless-stopped
    labels:
      app: wibsite
      service: chatwoot
    ports:
      - "${CHATWOOT_PORT:-3002}:3000"
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-https://localhost:8080/chatwoot}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: ${POSTGRES_USER:-wibsite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""
      INSTALLATION_ENV: docker
      NODE_ENV: production
      EXECJS_RUNTIME: Node
      RAILS_LOG_TO_STDOUT: "true"
      ACTIVE_STORAGE_SERVICE: local
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "false"
      # OIDC SSO via Authelia
      # OIDC_DISCOVERY_URL: host.docker.internal porque BusyBox/Alpine resuelve 'localhost' a
      # IPv6 [::1] (no tiene Nginx). host.docker.internal = 192.168.65.254 (Docker Desktop host)
      # Nginx fuerza Host: localhost:8080 → issuer siempre = https://localhost:8080
      ENABLE_OIDC: "true"
      OIDC_CLIENT_ID: chatwoot
      OIDC_CLIENT_SECRET: chatwoot_oidc_secret_2026
      OIDC_DISCOVERY_URL: https://host.docker.internal:8080/auth/.well-known/openid-configuration
      OIDC_SCOPE: "openid,profile,email"
      OIDC_UID_FIELD: preferred_username
      OIDC_NAME_FIELD: name
      OIDC_EMAIL_FIELD: email
      OIDC_ALLOW_DEFAULT_SIGN_UP: "true"
      SSL_VERIFY: "false"
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    extra_hosts:
      # Permite que 'localhost' dentro del container resuelva al host Docker
      # Necesario para que OIDC_DISCOVERY_URL https://localhost:8080/... sea accesible
      - "localhost:172.19.0.1"
    volumes:
      - chatwoot_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "rm -f /app/tmp/pids/server.pid &&
             bundle exec rails db:chatwoot_prepare &&
             bundle exec rails server -b 0.0.0.0 -p 3000"

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    container_name: wibsite-chatwoot-worker
    restart: unless-stopped
    labels:
      app: wibsite
      service: chatwoot-worker
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-https://localhost:8080/chatwoot}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: ${POSTGRES_USER:-wibsite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""
      INSTALLATION_ENV: docker
      NODE_ENV: production
      EXECJS_RUNTIME: Node
      DEFAULT_LOCALE: es
      ENABLE_ACCOUNT_SIGNUP: "false"
      # OIDC SSO via Authelia
      ENABLE_OIDC: "true"
      OIDC_CLIENT_ID: chatwoot
      OIDC_CLIENT_SECRET: chatwoot_oidc_secret_2026
      OIDC_DISCOVERY_URL: https://host.docker.internal:8080/auth/.well-known/openid-configuration
      OIDC_SCOPE: "openid,profile,email"
      OIDC_UID_FIELD: preferred_username
      OIDC_NAME_FIELD: name
      OIDC_EMAIL_FIELD: email
      OIDC_ALLOW_DEFAULT_SIGN_UP: "true"
      SSL_VERIFY: "false"
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    extra_hosts:
      - "localhost:172.19.0.1"
    volumes:
      - chatwoot_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq"]

  # ─── Dify ─────────────────────────────────────────────
  dify-api:
    image: langgenius/dify-api:latest
    container_name: wibsite-dify-api
    restart: unless-stopped
    labels:
      app: wibsite
      service: dify-api
    ports:
      - "${DIFY_API_PORT:-5001}:5001"
    environment:
      MODE: api
      EDITION: SELF_HOSTED
      INIT_PASSWORD: ${DIFY_ADMIN_PASSWORD:-admin123}
      MIGRATION_ENABLED: "true"
      LOG_LEVEL: INFO
      DEBUG: "false"
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-wibsite}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CELERY_BROKER_URL: redis://redis:6379/0
      VECTOR_STORE: weaviate
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_SCHEME: http
      WEAVIATE_BATCH_SIZE: 100
      SENTRY_TRACES_SAMPLE_RATE: 0.0
      # URL pública del browser (Nginx en 3003)
      CONSOLE_CORS_ALLOW_ORIGINS: http://localhost:3003
      CORS_ALLOWED_ORIGINS: "http://localhost:3003"
      API_COMPRESSION_ENABLED: "false"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      CHECK_UPDATE_URL: "false"
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_DAEMON_KEY}
      PLUGIN_DAEMON_TIMEOUT: 600.0
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_REMOTE_INSTALL_HOST: localhost
      PLUGIN_REMOTE_INSTALL_PORT: 5003
      PLUGIN_MAX_PACKAGE_SIZE: 52428800
      CODE_EXECUTION_ENDPOINT: http://dify-sandbox:8194
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ENABLE_OTEL: "true"
      OTLP_TRACE_ENDPOINT: http://otel-collector:4318/v1/traces
      OTLP_METRIC_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER: "always_on"
      APPLICATION_NAME: dify-api
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_started
      plugin-daemon:
        condition: service_started
      dify-sandbox:
        condition: service_started

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: wibsite-dify-worker
    restart: unless-stopped
    labels:
      app: wibsite
      service: dify-worker
    environment:
      MODE: worker
      EDITION: SELF_HOSTED
      LOG_LEVEL: INFO
      DEBUG: "false"
      SECRET_KEY: ${DIFY_SECRET_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-wibsite}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CELERY_BROKER_URL: redis://redis:6379/0
      VECTOR_STORE: weaviate
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_TIMEOUT: 30
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      CHECK_UPDATE_URL: "false"
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_MAX_PACKAGE_SIZE: 52428800
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ENABLE_OTEL: "true"
      OTLP_TRACE_ENDPOINT: http://otel-collector:4318/v1/traces
      OTLP_METRIC_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_TRACES_SAMPLER: "always_on"
      APPLICATION_NAME: dify-worker
    volumes:
      - dify_storage:/app/api/storage
    depends_on:
      - dify-api

  dify-web:
    image: langgenius/dify-web:latest
    container_name: wibsite-dify-web
    restart: unless-stopped
    labels:
      app: wibsite
      service: dify-web
    # dify-web no expone puertos directamente al host; Nginx actúa como proxy en el puerto 3003
    environment:
      EDITION: SELF_HOSTED
      # CONSOLE_API_URL/APP_API_URL → usados por el SSR de Next.js (servidor Docker interno)
      # NEXT_PUBLIC_* → usados por el browser (van via Nginx en puerto 3003)
      CONSOLE_API_URL: http://dify-api:5001
      APP_API_URL: http://dify-api:5001
      SENTRY_TRACES_SAMPLE_RATE: 0.0
      NEXT_TELEMETRY_DISABLED: "true"
      TEXT_GENERATION_TIMEOUT_MS: 60000
    depends_on:
      - dify-api
    entrypoint: ["/bin/sh", "-c", "export NEXT_PUBLIC_API_PREFIX=/console/api; export NEXT_PUBLIC_PUBLIC_API_PREFIX=/api; export NEXT_PUBLIC_MARKETPLACE_API_PREFIX=http://localhost:3003/marketplace/api/v1; exec node /app/targets/next/web/server.js"]

  # ─── Plugin Daemon ─────────────────────────────────────
  plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.3-local
    container_name: wibsite-plugin-daemon
    restart: unless-stopped
    ports:
      - "5002:5002"
    labels:
      app: wibsite
      service: plugin-daemon
    environment:
      SERVER_PORT: 5002
      SERVER_KEY: ${PLUGIN_DAEMON_KEY}
      DB_DATABASE: dify_plugin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-wibsite}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAX_PLUGIN_PACKAGE_SIZE: 52428800
      PPROF_ENABLED: "false"
      DIFY_INNER_API_URL: http://dify-api:5001
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY}
      PLUGIN_WORKING_PATH: /app/storage/cwd
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      FORCE_VERIFYING_SIGNATURE: "false"
      PLUGIN_REMOTE_INSTALLING_HOST: plugin-daemon
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
    volumes:
      - plugin_daemon_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── n8n ──────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: wibsite-n8n
    restart: unless-stopped
    labels:
      app: wibsite
      service: n8n
    ports:
      - "${N8N_PORT:-5679}:5678"
    environment:
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PATH: /n8n/
      N8N_TELEMETRY_DISABLED: "true"
      # URL pública via Nginx — HTTPS para que el OIDC callback sea HTTPS (requerido por Authelia)
      # n8n genera el callback como: WEBHOOK_URL + /rest/sso/oidc/callback
      WEBHOOK_URL: https://localhost:8080
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-wibsite}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-wibsite_pass}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_METRICS: "false"
      # N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN: "true"  # deprecated in 2.23.4
      N8N_MANUAL_EXECUTION_TIMEOUT: 120
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Auth n8n: usa sistema de usuarios propio (email/password — community edition)
      # NOTA: el acceso SSO está garantizado a nivel de Nginx/Authelia (auth_request en /n8n/)
      # El módulo SSO-OIDC de n8n requiere licencia enterprise (feat:oidc) — no disponible
      # Sin licencia, N8N_AUTH_METHOD=oidc causa que los endpoints /rest/sso/oidc/* devuelvan 404
      N8N_AUTH_METHOD: email
      # La config OIDC se deja comentada para referencia si se obtiene licencia en el futuro
      # N8N_AUTH_OIDC_CLIENT_ID: n8n
      # N8N_AUTH_OIDC_CLIENT_SECRET: n8n_oidc_secret_2026
      # N8N_AUTH_OIDC_AUTHORIZATION_URL: https://localhost:8080/auth/api/oidc/authorization
      # N8N_AUTH_OIDC_TOKEN_URL: http://authelia:9091/api/oidc/token
      # N8N_AUTH_OIDC_USER_INFO_URL: http://authelia:9091/api/oidc/userinfo
      # N8N_AUTH_OIDC_JWKS_URL: http://authelia:9091/jwks.json
      # N8N_AUTH_OIDC_ISSUER: https://localhost:8080
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # API keys for workflow integrations
      DIFY_API_KEY: ${DIFY_API_KEY}
      CHATWOOT_API_KEY: ${CHATWOOT_API_KEY}
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      META_APP_ID: ${META_APP_ID}
      META_API_VERSION: ${META_API_VERSION}
      META_APP_ACCESS_TOKEN: ${META_APP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_SANDBOX_NUMBER: ${TWILIO_SANDBOX_NUMBER}
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/n8n-workflows
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Dify Sandbox (Code Execution) ────────────────────
  dify-sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: wibsite-dify-sandbox
    restart: unless-stopped
    labels:
      app: wibsite
      service: dify-sandbox
    environment:
      # The sandbox uses default config; expose on port 8194
      GIN_MODE: release
    ports:
      - "8194:8194"

  # ─── Twenty CRM ───────────────────────────────────────
  twenty-server:
    image: twentycrm/twenty:latest
    container_name: wibsite-twenty-server
    restart: unless-stopped
    labels:
      app: wibsite
      service: twenty-server
    ports:
      - "${TWENTY_PORT:-3001}:3000"
    environment:
      PORT: 3000
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3001}
      FRONTEND_URL: ${TWENTY_FRONTEND_URL:-http://localhost:3001}
      ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET}
      LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET}
      FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET}
      PG_DATABASE_URL: postgres://${POSTGRES_USER:-wibsite}:${POSTGRES_PASSWORD:-wibsite_pass}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}
      ENABLE_DB_MIGRATIONS: "true"
      SIGN_IN_PREFILLED: "true"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - twenty_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Helper Node (integración personalizada) ──────────
  helper:
    build:
      context: ./helper-node
      dockerfile: Dockerfile
    container_name: wibsite-helper
    restart: unless-stopped
    labels:
      app: wibsite
      service: helper
    ports:
      - "${HELPER_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      HELPER_API_KEY: ${HELPER_API_KEY}
      STORE_MODE: ${STORE_MODE:-dual}
      N8N_URL: http://n8n:5678
      DIFY_API_URL: http://dify-api:5001
      CHATWOOT_URL: http://chatwoot:3000
      TWENTY_URL: http://twenty-server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_SANDBOX_NUMBER: ${TWILIO_SANDBOX_NUMBER}
      REDIS_URL: redis://redis:6379
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-http://glitchtip:8282}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: app_user
      PG_PASSWORD: app_user_pass_2026
      PG_DATABASE: wibsite
      # Observabilidad
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - n8n
      - dify-api
      - chatwoot
      - twenty-server

  # ─── DOAG-S (Elastic Stack + OpenTelemetry) ───────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.4.2}
    container_name: wibsite-elasticsearch
    restart: unless-stopped
    labels:
      app: wibsite
      service: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.4.2}
    container_name: wibsite-kibana
    restart: unless-stopped
    labels:
      app: wibsite
      service: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${KIBANA_SERVICE_TOKEN}
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
      - SERVER_PUBLICBASEURL=https://localhost:8080/kibana
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - LOGGING_ROOT_LEVEL=warn
    ports:
      - "5601:5601"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: wibsite-otel-collector
    restart: unless-stopped
    labels:
      app: wibsite
      service: otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-wibsite_elastic_pass_2026}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - elasticsearch
    ports:
      - "4317:4317"
      - "4318:4318"

  # ─── MinIO (Object Storage) ──────────────────────────
  minio:
    image: minio/minio:latest
    container_name: wibsite-minio
    restart: unless-stopped
    labels:
      app: wibsite
      service: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_X_FRAME_OPTIONS: ALLOWALL
      MINIO_BROWSER: "on"
      # OIDC via Authelia directo (HTTP, sin TLS) - evita el problema del cert auto-firmado
      # MinIO hace el discovery server-to-server desde Docker network
      # La authorization_endpoint del discovery interno = http://authelia:9091/...
      # MinIO Console redirige al browser a REDIRECT_URI (que sí es HTTPS)
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://authelia:9091/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: minio_oidc_secret_2026
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Wibsite SSO
      MINIO_IDENTITY_OPENID_CLAIM_NAME: preferred_username
      MINIO_IDENTITY_OPENID_REDIRECT_URI: https://localhost:8080/minio-console/oauth_callback
      MINIO_IDENTITY_OPENID_SCOPES: openid,profile,email
    extra_hosts:
      - "localhost:172.19.0.1"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Authelia SSO ──────────────────────────────────────
  authelia:
    image: authelia/authelia:4.37
    container_name: wibsite-authelia
    restart: unless-stopped
    labels:
      app: wibsite
      service: authelia
    volumes:
      - ./authelia:/config
    environment:
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy

  # ─── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: wibsite-nginx
    restart: unless-stopped
    labels:
      app: wibsite
      service: nginx
    ports:
      - "${NGINX_PORT:-8080}:443"
      - "80:80"
      - "3003:3003"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./hub:/usr/share/nginx/html/hub:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - chatwoot
      - dify-web
      - n8n
      - twenty-server

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
  chatwoot_data:
  dify_storage:
  n8n_data:
  twenty_data:
  plugin_daemon_data:
  elasticsearch_data:
  minio_data:

