<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wibsite Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 240px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid #334155; }
  .sidebar-header h1 { font-size: 18px; color: #38bdf8; }
  .sidebar-header span { font-size: 11px; color: #64748b; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #94a3b8; transition: all 0.2s; font-size: 14px; }
  .nav-item:hover { background: #334155; color: #e2e8f0; }
  .nav-item.active { background: #0ea5e9; color: #fff; }
  .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 48px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
  .topbar .breadcrumb { font-size: 13px; color: #64748b; }
  .topbar .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; }
  .topbar .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .topbar .search-hint { font-size: 11px; color: #475569; border: 1px solid #334155; border-radius: 6px; padding: 4px 10px; }
  .topbar .notif-badge { position: relative; cursor: pointer; font-size: 15px; }
  .topbar .notif-count { position: absolute; top: -6px; right: -8px; background: #ef4444; color: #fff; font-size: 9px; border-radius: 8px; padding: 1px 5px; display: none; }
  .content { flex: 1; position: relative; }
  .content iframe { width: 100%; height: 100%; border: none; }
  .watermark { position: fixed; bottom: 8px; right: 8px; font-size: 10px; color: #334155; pointer-events: none; z-index: 9999; }
  /* Lead Panel */
  .lead-panel { width: 300px; background: #1e293b; border-left: 1px solid #334155; display: none; flex-direction: column; flex-shrink: 0; }
  .lead-panel.open { display: flex; }
  .lead-panel-header { padding: 12px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px; }
  .lead-panel-header h2 { font-size: 14px; flex: 1; }
  .lead-panel-header button { background: none; border: none; color: #64748b; cursor: pointer; font-size: 14px; }
  .lead-panel-body { flex: 1; overflow-y: auto; padding: 12px; font-size: 12px; }
  .lead-panel-body .row { margin-bottom: 8px; }
  .lead-panel-body .label { color: #64748b; font-size: 10px; text-transform: uppercase; }
  .lead-panel-body .value { color: #e2e8f0; }
  .lead-panel-body .tag { display: inline-block; background: #334155; color: #94a3b8; border-radius: 4px; padding: 2px 8px; margin: 2px; font-size: 10px; }
  /* Search overlay */
  .search-overlay { position: fixed; inset: 0; background: rgba(2,6,23,.75); z-index: 10000; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  .search-overlay.open { display: flex; }
  .search-box { width: 560px; max-width: 92vw; background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .search-input { width: 100%; background: none; border: none; outline: none; color: #e2e8f0; font-size: 16px; padding: 16px; }
  .search-results { max-height: 55vh; overflow-y: auto; }
  .search-result { padding: 10px 16px; cursor: pointer; display: flex; gap: 10px; align-items: center; border-top: 1px solid #1e293b; }
  .search-result:hover { background: #0f172a; }
  .search-result .icon { font-size: 16px; }
  .search-result .title { font-size: 13px; color: #e2e8f0; }
  .search-result .sub { font-size: 11px; color: #64748b; }
  .search-empty { padding: 24px; text-align: center; color: #64748b; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Wibsite</h1>
      <span>Portal Unificado</span>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="breadcrumb" id="breadcrumb">Dashboard</span>
      <span class="search-hint">Ctrl+K · Búsqueda global</span>
      <div class="status">
        <span class="notif-badge" id="notifBtn" title="Notificaciones">🔔<span class="notif-count" id="notifCount"></span></span>
        <span class="dot"></span>
        <span id="statusText">Conectado</span>
      </div>
    </header>
    <div class="content" id="content">
      <iframe id="moduleFrame" sandbox="allow-scripts allow-forms allow-same-origin" loading="lazy"></iframe>
    </div>
  </div>
  <aside class="lead-panel" id="leadPanel">
    <div class="lead-panel-header">
      <h2>Lead Activo</h2>
      <button onclick="closeLeadPanel()">✕</button>
    </div>
    <div class="lead-panel-body" id="leadPanelBody"></div>
  </aside>
</div>
<div class="watermark">Wibsite v2.2.0</div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input class="search-input" id="searchInput" placeholder="Buscar leads, campañas… (Esc para cerrar)" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script>
const MODULES = [
  { id: 'hub', label: 'Dashboard', icon: '📊', url: '/hub/' },
  { id: 'admin', label: 'Admin', icon: '⚙️', url: '/admin/' },
  { id: 'chatwoot', label: 'Inbox', icon: '💬', url: '/chatwoot/' },
  { id: 'crm', label: 'CRM', icon: '👥', url: '/crm/' },
  { id: 'dify', label: 'IA Studio', icon: '🧠', url: '/dify/' },
  { id: 'n8n', label: 'Automations', icon: '⚡', url: '/n8n/' },
  { id: 'kibana', label: 'Metrics', icon: '📈', url: '/kibana/' },
  { id: 'storage', label: 'Storage', icon: '📁', url: '/minio-console/' }
];

const nav = document.getElementById('nav');
const frame = document.getElementById('moduleFrame');
const breadcrumb = document.getElementById('breadcrumb');
const statusText = document.getElementById('statusText');

function navigate(moduleId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.querySelector(`[data-module="${moduleId}"]`);
  if (navEl) navEl.classList.add('active');
  frame.src = mod.url;
  breadcrumb.textContent = mod.label;
  sessionStorage.setItem('wibsite:active:module', moduleId);
  window.parent?.postMessage({ type: 'wibsite-portal', module: moduleId }, '*');
}

MODULES.forEach(mod => {
  const el = document.createElement('div');
  el.className = 'nav-item';
  el.dataset.module = mod.id;
  el.innerHTML = `<span class="icon">${mod.icon}</span> ${mod.label}`;
  el.addEventListener('click', () => navigate(mod.id));
  nav.appendChild(el);
});

navigate('hub');

window.addEventListener('message', (event) => {
  if (event.data?.type === 'wibsite-module' && event.data?.leadId) {
    sessionStorage.setItem('wibsite:active:lead', event.data.leadId);
    openLeadPanel(event.data.leadId);
  }
});

setInterval(async () => {
  try {
    const resp = await fetch('/api/health');
    if (resp.ok) {
      statusText.textContent = 'Conectado';
      document.querySelector('.status .dot').style.background = '#22c55e';
    }
  } catch {
    statusText.textContent = 'Desconectado';
    document.querySelector('.status .dot').style.background = '#ef4444';
  }
}, 30000);

// ── Lead Context Panel (Fase 2 del diseño) ──
async function openLeadPanel(leadId) {
  const panel = document.getElementById('leadPanel');
  const body = document.getElementById('leadPanelBody');
  try {
    const resp = await fetch(`/api/leads/${encodeURIComponent(leadId)}/profile`);
    if (!resp.ok) throw new Error('lead no encontrado');
    const p = await resp.json();
    body.innerHTML = `
      <div class="row"><div class="label">Nombre</div><div class="value">${p.name || '—'}</div></div>
      <div class="row"><div class="label">Contacto</div><div class="value">${p.phone || p.email || '—'}</div></div>
      <div class="row"><div class="label">Score</div><div class="value">${p.score ?? '—'}</div></div>
      <div class="row"><div class="label">Estado</div><div class="value">${p.status || '—'}</div></div>
      <div class="row"><div class="label">Etiquetas</div><div>${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('') || '<span class="value">—</span>'}</div></div>
      <div class="row"><div class="label">Next Action</div><div class="value">${p.next_action || '—'}</div></div>
    `;
    panel.classList.add('open');
  } catch (e) {
    body.innerHTML = `<div class="search-empty">No se pudo cargar el perfil del lead.</div>`;
    panel.classList.add('open');
  }
}

function closeLeadPanel() {
  document.getElementById('leadPanel').classList.remove('open');
}

// ── Búsqueda global Ctrl+K ──
const overlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    overlay.classList.add('open');
    searchInput.value = '';
    searchInput.focus();
    searchResults.innerHTML = '<div class="search-empty">Escribe para buscar…</div>';
  }
  if (e.key === 'Escape') overlay.classList.remove('open');
});
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });

let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) { searchResults.innerHTML = '<div class="search-empty">Escribe para buscar…</div>'; return; }
  searchTimer = setTimeout(async () => {
    try {
      const resp = await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=10`);
      const data = await resp.json();
      const items = [...(data.leads || []), ...(data.campaigns || [])];
      if (!items.length) { searchResults.innerHTML = '<div class="search-empty">Sin resultados para tu búsqueda.</div>'; return; }
      searchResults.innerHTML = items.map(item => `
        <div class="search-result" data-type="${item.type}" data-id="${item.id}">
          <span class="icon">${item.type === 'lead' ? '👤' : '📣'}</span>
          <div><div class="title">${item.title}</div><div class="sub">${item.subtitle || ''}</div></div>
        </div>`).join('');
      searchResults.querySelectorAll('.search-result').forEach(el => el.addEventListener('click', () => {
        if (el.dataset.type === 'lead') openLeadPanel(el.dataset.id);
        else navigate('admin');
        overlay.classList.remove('open');
      }));
    } catch (e) {
      searchResults.innerHTML = '<div class="search-empty">Error al buscar.</div>';
    }
  }, 250);
});

// ── Notificaciones unificadas ──
async function refreshNotifications() {
  try {
    const resp = await fetch('/api/notifications');
    if (!resp.ok) return;
    const data = await resp.json();
    const count = data.total || 0;
    const badge = document.getElementById('notifCount');
    if (count > 0) {
      badge.style.display = 'block';
      badge.textContent = count > 99 ? '99+' : count;
    } else {
      badge.style.display = 'none';
    }
    window._notifications = data.data || [];
  } catch (e) { /* sin conexión */ }
}
document.getElementById('notifBtn').addEventListener('click', () => {
  const list = window._notifications || [];
  const text = list.length
    ? list.slice(0, 8).map(n => `• [${n.severity}] ${n.text}`).join('\n')
    : 'Sin notificaciones activas.';
  alert('Notificaciones (24h)\n' + text);
});
refreshNotifications();
setInterval(refreshNotifications, 60000);
</script>
</body>
</html>
