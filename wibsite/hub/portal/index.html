<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wibsite Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 240px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid #334155; }
  .sidebar-header h1 { font-size: 18px; color: #38bdf8; }
  .sidebar-header span { font-size: 11px; color: #64748b; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #94a3b8; transition: all 0.2s; font-size: 14px; }
  .nav-item:hover { background: #334155; color: #e2e8f0; }
  .nav-item.active { background: #0ea5e9; color: #fff; }
  .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .topbar { height: 48px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; padding: 0 16px; gap: 16px; }
  .topbar .breadcrumb { font-size: 13px; color: #64748b; }
  .topbar .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #64748b; }
  .topbar .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .content { flex: 1; position: relative; }
  .content iframe { width: 100%; height: 100%; border: none; }
  .watermark { position: fixed; bottom: 8px; right: 8px; font-size: 10px; color: #334155; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Wibsite</h1>
      <span>Portal Unificado</span>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="breadcrumb" id="breadcrumb">Dashboard</span>
      <div class="status">
        <span class="dot"></span>
        <span id="statusText">Conectado</span>
      </div>
    </header>
    <div class="content" id="content">
      <iframe id="moduleFrame" sandbox="allow-scripts allow-forms allow-same-origin" loading="lazy"></iframe>
    </div>
  </div>
</div>
<div class="watermark">Wibsite v2.2.0</div>

<script>
const MODULES = [
  { id: 'hub', label: 'Dashboard', icon: '📊', url: '/hub/' },
  { id: 'admin', label: 'Admin', icon: '⚙️', url: '/admin/' },
  { id: 'chatwoot', label: 'Inbox', icon: '💬', url: '/chatwoot/' },
  { id: 'crm', label: 'CRM', icon: '👥', url: '/crm/' },
  { id: 'dify', label: 'IA Studio', icon: '🧠', url: '/dify/' },
  { id: 'n8n', label: 'Automations', icon: '⚡', url: '/n8n/' },
  { id: 'grafana', label: 'Metrics', icon: '📈', url: '/grafana/' },
  { id: 'glitchtip', label: 'Errors', icon: '🐛', url: '/glitchtip/' },
  { id: 'storage', label: 'Storage', icon: '📁', url: '/minio-console/' }
];

const nav = document.getElementById('nav');
const frame = document.getElementById('moduleFrame');
const breadcrumb = document.getElementById('breadcrumb');
const statusText = document.getElementById('statusText');

function navigate(moduleId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.querySelector(`[data-module="${moduleId}"]`);
  if (navEl) navEl.classList.add('active');
  frame.src = mod.url;
  breadcrumb.textContent = mod.label;
  sessionStorage.setItem('wibsite:active:module', moduleId);
  window.parent?.postMessage({ type: 'wibsite-portal', module: moduleId }, '*');
}

MODULES.forEach(mod => {
  const el = document.createElement('div');
  el.className = 'nav-item';
  el.dataset.module = mod.id;
  el.innerHTML = `<span class="icon">${mod.icon}</span> ${mod.label}`;
  el.addEventListener('click', () => navigate(mod.id));
  nav.appendChild(el);
});

navigate('hub');

window.addEventListener('message', (event) => {
  if (event.data?.type === 'wibsite-module' && event.data?.leadId) {
    sessionStorage.setItem('wibsite:active:lead', event.data.leadId);
  }
});

setInterval(async () => {
  try {
    const resp = await fetch('/api/health');
    if (resp.ok) {
      statusText.textContent = 'Conectado';
      document.querySelector('.status .dot').style.background = '#22c55e';
    }
  } catch { 
    statusText.textContent = 'Desconectado';
    document.querySelector('.status .dot').style.background = '#ef4444';
  }
}, 30000);
</script>
</body>
</html>
