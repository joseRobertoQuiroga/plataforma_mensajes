          - openid
          - profile
          - email
        grant_types:
          - authorization_code
        response_types:
          - code
      - id: chatwoot
        description: Chatwoot
        secret: chatwoot_oidc_secret_2026
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://localhost:8080/chatwoot/auth/oidc/callback
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - authorization_code
        response_types:
          - code
      - id: twenty
        description: Twenty CRM
        secret: twenty_oidc_secret_2026
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://localhost:8080/crm/auth/oidc/callback
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - authorization_code
        response_types:
          - code
      - id: dify
        description: Dify
        secret: dify_oidc_secret_2026
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://localhost:8080/dify/console/api/oauth/authorize/oidc
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - authorization_code
        response_types:
          - code