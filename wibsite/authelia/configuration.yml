server:
  host: 0.0.0.0
  port: 9091
  read_buffer_size: 16384

log:
  level: info

theme: dark

jwt_secret: ${AUTHELIA_JWT_SECRET}

default_redirection_url: https://localhost:8080/hub/

totp:
  issuer: wibsite.com
  period: 30
  skew: 1

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: deny
  rules:
    - domain: localhost
      policy: bypass
      resources:
        - "^/hub/.*$"
        - "^/$"
        - "^/webhooks/.*$"
        - "^/webhook/.*$"
        - "^/opt-outs/.*$"
        - "^/health$"
        - "^/api/health$"
        - "^/storage/.*$"
    - domain: localhost
      policy: one_factor
      resources:
        - "^/admin/.*$"
        - "^/n8n/.*$"
        - "^/chatwoot/.*$"
        - "^/crm/.*$"
        - "^/dify/.*$"
        - "^/kibana/.*$"
        - "^/minio-console/.*$"
        - "^/erp/.*$"
        - "^/reportes/.*$"
        - "^/portal/.*$"
    - domain: "{domain}.{tld}"
      policy: one_factor
      resources:
        - "^/.*$"

session:
  name: wibsite_session
  domain: localhost
  secret: ${AUTHELIA_SESSION_SECRET}
  expiration: 8h
  inactivity: 2h
  remember_me_duration: 30d

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notifications.yml

