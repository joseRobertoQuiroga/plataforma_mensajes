          # OAuth2 credential callback para integraciones de workflows
          - https://localhost:8080/n8n/rest/oauth2-credential/callback
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - authorization_code
        response_types:
          - code
      - id: minio
        description: MinIO Console
        secret: minio_oidc_secret_2026
        public: false
        authorization_policy: one_factor
