    access_token_lifespan: 1h
    authorize_code_lifespan: 1m
    id_token_lifespan: 1h
    refresh_token_lifespan: 90m
    enforce_pkce: "never"
    clients:
      - id: n8n
        description: n8n
        secret: n8n_oidc_secret_2026
        public: false
        authorization_policy: one_factor
        redirect_uris:
          # SSO login callback (generado por n8n OidcService desde WEBHOOK_URL/rest/sso/oidc/callback)
